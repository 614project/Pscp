name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release runs the same checks before building packages.
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Pscp.slnx -c Debug
      - name: Transpiler, sample-program and language-server tests
        run: dotnet run --project tests/Pscp.Transpiler.Tests -c Debug --no-build

  installer:
    name: Build Windows installer project
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build installer
        run: dotnet build src/Pscp.Installer/Pscp.Installer.csproj -c Release
